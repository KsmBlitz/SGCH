name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Pruebas de integración de la API contra la base local
        working-directory: apps/api
        env:
          SGCH_REQUIRE_DB: "1"
        run: |
          uv sync --locked
          uv run pytest
